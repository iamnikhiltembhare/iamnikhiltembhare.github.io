<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nikhil Tembhare — Resume</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 10mm 14mm; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 820px; padding: 0 24px; font: 400 9pt/1.34 Inter, system-ui, sans-serif; color: #14161c; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  h1 { font: 700 26pt/1.05 "Space Grotesk", Inter; margin: 0; letter-spacing: -.02em; }
  .role { font: 600 13pt "Space Grotesk", Inter; color: #5b4cf0; margin-top: 4px; }
  .meta { margin-top: 8px; color: #5b606b; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 9.5pt; }
  .meta a { color: inherit; text-decoration: none; }
  h2 { font: 700 9.5pt Inter; letter-spacing: .12em; text-transform: uppercase; color: #5b4cf0; border-bottom: 1px solid #dcdad2; padding-bottom: 4px; margin: 10px 0 5px; break-after: avoid; }
  .job { margin-bottom: 9px; break-inside: avoid; }
  .job-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .job-head strong { font-weight: 600; }
  .job-head span { color: #5b606b; font-size: 9pt; white-space: nowrap; }
  .co { color: #5b606b; }
  ul { margin: 3px 0 0; padding-left: 16px; } li { margin: 1px 0; }
  .skills { display: grid; grid-template-columns: 130px 1fr; gap: 3px 12px; }
  .skills b { font-weight: 600; }
</style></head><body>
<header><h1 id="name"></h1><div class="role" id="role"></div><div class="meta" id="meta"></div></header>
<h2>Summary</h2><p id="summary" style="margin:0"></p>
<h2>Experience</h2><div id="exp"></div>
<h2>Education</h2><div id="edu"></div>
<h2>Skills</h2><div class="skills" id="skills"></div>
<script src="js/data.js"></script>
<script>
  const d = window.PORTFOLIO, $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.title = `${d.name} — Resume`;
  $("#name").textContent = d.name; $("#role").textContent = d.role;
  const link = (u) => u.replace(/^https?:\/\/(www\.)?/, "");
  $("#meta").innerHTML = [d.location, `<a href="mailto:${esc(d.email)}">${esc(d.email)}</a>`,
    ...d.socials.filter((s) => /GitHub|LinkedIn/.test(s.label)).map((s) => `<a href="${esc(s.url)}">${esc(link(s.url))}</a>`),
    "iamnikhiltembhare.github.io"].map((x) => `<span>${x}</span>`).join("");
  $("#summary").textContent = d.about[0] + " " + d.about[1];
  const job = (e) => `<div class="job"><div class="job-head"><div><strong>${esc(e.role)}</strong> <span class="co">· ${esc(e.company)}</span></div><span>${esc(e.period)}</span></div><ul>${e.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>`;
  $("#exp").innerHTML = d.experience.filter((e) => e.type !== "education").map(job).join("");
  $("#edu").innerHTML = d.experience.filter((e) => e.type === "education").map(job).join("");
  $("#skills").innerHTML = d.skills.map((g) => `<b>${esc(g.group)}</b><span>${g.items.map((i) => esc(typeof i === "string" ? i : i.name)).join(", ")}</span>`).join("");
</script></body></html>
